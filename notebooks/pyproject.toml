[project]
name = "vgi-bea-notebooks"
version = "0.1.0"
description = "Released BEA discovery, units and availability SQL examples"
requires-python = ">=3.12,<3.15"
dependencies = ["vgi-example-notebooks[runner]"]
[tool.uv.sources]
vgi-example-notebooks = { git = "https://github.com/Query-farm/vgi-example-notebooks", tag = "v0.3.30" }
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
[tool.ruff.lint.per-file-ignores]
# JupySQL assigns result variables inside SQL magic cells.
"*.ipynb" = ["F821"]
